<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>State v. Caleb Jensen · TrialSim player</title>
<style>
:root{--bg:#14161b;--panel:#1d2027;--line:#2e333d;--ink:#e9e6df;--mute:#9aa0a6;--accent:#f5a524;
  --g:#e5484d;--ng:#3e8ef7;--u:#8b9099;--think:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px;margin:2px 0 10px}
.phases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.phases button{background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:999px;
  padding:3px 12px;font-size:13px;cursor:pointer}
.phases button.on{color:#111;background:var(--accent);border-color:var(--accent);font-weight:600}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#000}
.stage svg{display:block;width:100%;height:auto}
#dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:12px 16px;
  min-height:150px;max-height:260px;overflow:auto}
#dlg .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
#dlg .name{font-weight:700;font-size:16px}
#dlg .chip:empty{display:none}
#dlg .chip{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 8px}
#dlg .kind{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
#dlg.think{border:1px dashed var(--think);background:#211d2e}
#dlg.think .kind{color:var(--think)}
#dlg.think #txt{font-style:italic;color:#d9d0f5}
#txt{white-space:pre-wrap}
.polls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.pj{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.pj b{display:block}
.bar{height:6px;border-radius:3px;background:#2a2e36;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.ctrl button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;font-size:15px;cursor:pointer;min-width:44px}
.ctrl button.play{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700;min-width:84px}
.ctrl select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px}
.ctrl label{color:var(--mute);font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
#prog{flex:1 1 200px;accent-color:var(--accent)}
#count{color:var(--mute);font-size:13px;min-width:70px;text-align:right}
.hint{color:var(--mute);font-size:12px;margin-top:8px}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(10,10,14,.45);cursor:pointer;border:0;width:100%;padding:0}
#start span{background:var(--accent);color:#111;font-weight:800;font-size:22px;border-radius:999px;
  padding:14px 30px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#endcard{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(10,10,14,.78);padding:16px}
#endcard .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;
  max-width:560px;text-align:center}
#endcard .big{font-size:30px;font-weight:800;letter-spacing:.02em}
#endcard .truth{margin-top:14px;text-align:left;font-size:14px;color:#d8d4cc;display:none}
#endcard button{margin-top:14px;background:var(--accent);color:#111;border:0;border-radius:8px;
  padding:8px 16px;font-weight:700;cursor:pointer}
@media (max-width:600px){main{padding:12px}h1{font-size:18px}#dlg{max-height:220px}}

/* scene animation */
.talking .mouth-talk{animation:talk .22s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.talking{animation:bob .5s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.shake{animation:shake .12s 8 alternate}
@keyframes shake{from{transform:translateX(-4px) rotate(-1deg)}to{transform:translateX(4px) rotate(1deg)}}
.pulse{animation:pulse 1.1s ease-out 1}
@keyframes pulse{0%{stroke-width:14;opacity:.2}60%{stroke-width:8;opacity:1}100%{stroke-width:6}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) 1;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.gavel{transform-box:fill-box;transform-origin:85% 85%}
.gavel.hit{animation:gavel .25s 3 alternate}
@keyframes gavel{from{transform:rotate(0)}to{transform:rotate(-38deg)}}
.cane{transform-box:fill-box;transform-origin:50% 100%;animation:cane .18s 10 alternate}
@keyframes cane{from{transform:rotate(-14deg) translateY(-14px)}to{transform:rotate(14deg) translateY(-18px)}}
.zzz{animation:zzz 2s infinite}
@keyframes zzz{from{opacity:0;transform:translate(0,0)}50%{opacity:1}to{opacity:0;transform:translate(10px,-22px)}}
.steam{animation:steam 1.2s infinite}
@keyframes steam{from{opacity:.9;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-26px) scale(1.4)}}
.dots circle{animation:dot 1s infinite}
.dots circle:nth-child(2){animation-delay:.15s}.dots circle:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
.flash{opacity:0;animation:flash 1.2s ease-out 1}
@keyframes flash{from{opacity:.55}to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

at and hammer him on the boot prints and the timer. I'll make the jury feel like they're protecting their neighbors by putting this man behind bars.\n\nPlanning to spin or hide: I'm going to portray the boot print (E2) as an 'irrefutable' link, making it sound like a fingerprint. I'm going to frame the phone call (E4) as a 'premeditated' attempt to create a fake alibi, and I'm going to completely ignore the fact that the hair (E5) is 'common' to make it seem like more damning evidence of his presence.", "moods": {"pros": "think", "judge": "neutral"}, "fx": [], "pat": 100, "stand": null, "standIdx": 0, "jp": 0}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "opening", "scene": "court", "text": "Now, I want y'all to take a moment and think about Lena Torres. She was a sweet girl, the kind of person who’d give you a warm smile and a loaf of bread like a neighbor helping out. She was a cornerstone of our community. Then, she was taken from us. Now, that fancy-looking lawyer over there might try to weave you some complicated yarns about \"maybe\" and \"perhaps,\" but the truth in this case is as plain as a fence post in a wide pasture. We’ve got the boot prints, Exhibit E2, that stick to Mr. Jensen like a brand on a heifer. We’ve got the timer, Exhibit E6, and the footage, Exhibit E3, showing him in that bakery. And that phone call at 18:55, Exhibit E4? That wasn't a man seeking counsel; it was a desperate man trying to build a wall of lies to hide his tracks. He thought he could outrun the truth, but he’s about to find out that the truth is a long road home.", "moods": {"baba": "sleep", "judge": "neutral"}, "fx": [], "kind": "Opening statement", "pat": 92, "stand": null, "standIdx": 0, "jp": 0}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "opening", "scene": "court", "kind": "Thinks privately", "text": "The prosecution has presented some compelling circumstantial evidence, but it's all just that—circumstantial. The key is to exploit the reasonable doubt inherent in their case. The blood spatter pattern suggests a point of origin, but it doesn't tie directly to Caleb. The flour footprint could belong to anyone. The surveillance footage is grainy, and the phone call is ambiguous. The timer is interesting, but it doesn't prove murder. This is a case built on assumptions, and assumptions don't convict.\n\nPlanning to spin or hide: I will exaggerate the ambiguity of the surveillance footage and downplay the significance of the footprint. I will emphasize the lack of direct evidence tying Caleb to the crime and focus on the reasonable doubt.", "moods": {"def": "think", "judge": "neutral"}, "fx": [], "pat": 92, "stand": null, "standIdx": 0, "jp": 0}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "opening", "scene": "court", "text": "Ladies and gentlemen of the jury, the prosecution has presented a narrative woven with threads of coincidence and circumstantial evidence. They ask you to convict a man based on assumptions, not proof. A footprint, a timer, a phone call, a grainy video—these are not evidence of guilt beyond a reasonable doubt. They are fragments of a puzzle that, when examined closely, do not fit together.\n\nExhibit E2, the so-called damning footprint—where is the proof it belongs to Caleb Jensen? It could be anyone’s. Exhibit E6, the timer—does it prove murder, or merely indicate someone was baking? Exhibit E4, the phone call—does it show guilt, or a man seeking counsel? And Exhibit E3, the surveillance footage—can you truly identify Caleb Jensen in that blurry image?\n\nThe prosecution wants you to fill in the gaps with speculation. But speculation is not justice. Reasonable doubt is not a technicality; it is the cornerstone of our legal system. And in this case, reasonable doubt is not just present—it is overwhelming. Thank you.", "moods": {"baba": "sleep", "judge": "neutral"}, "fx": [], "kind": "Opening statement", "pat": 87, "stand": null, "standIdx": 0, "jp": 0}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "opening", "scene": "court", "kind": "Private reflection", "text": "I reckon I hit 'em right where the heart is. I painted that city-slicker lawyer like a fox in the henhouse, and I kept my talk plain enough for the folks in the back pews to follow. They're lookin' at me like I'm the neighbor tellin' the truth, and that's exactly where I want 'em.\n\nWorried about: That fancy-pants defense man is tryin' to make 'em think the evidence is just a bunch of scraps. If he keeps tryin' to make 'em doubt the blurry video or the 'partial' print, I gotta be ready to stitch them pieces together like a quilt so they see one big, ugly picture of what happened to that girl.\n\nHonesty check: I stretched that boot print a bit by callin' it a 'brand' since it's only a partial, and I painted that phone call as a 'wall of lies' to make it sound more sinister than it might be on paper, but a man's gotta be bold to get a conviction.", "moods": {"pros": "think", "judge": "neutral"}, "fx": [], "pat": 87, "stand": null, "standIdx": 0, "jp": 0}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "opening", "scene": "court", "kind": "Private reflection", "text": "The opening statement was well-received, setting a tone of skepticism and highlighting the lack of concrete evidence. The jury seems engaged, and the prosecutor appears slightly ruffled, which is a good sign.\n\nWorried about: The prosecutor's emotional appeal to the jury was powerful. I need to counter that with a strong, logical narrative that doesn't rely too heavily on technicalities.\n\nHonesty check: The statement about the footprint belonging to anyone is a stretch, but it's a necessary part of creating reasonable doubt. The rest is a fair interpretation of the evidence.", "moods": {"def": "smirk", "judge": "neutral"}, "fx": er just as tight as a knot in a heavy rope. I don't care about 'reasonable doubt'—I want to make them see the man in the dock as the man in the boot prints. I'll make the jury feel the loss of Lena first, then I'll show 'em how the evidence paints a picture as plain as a pikestaff.\n\nPlanning to spin or hide: I'm going to paint the 'blurry' video (E3) as a man acting with 'guilty intent' to hide his face. I'm going to ignore the fact that the hair (E5) is 'common'—it doesn't matter if the hair is common when the boots (E2) are specific.", "moods": {"pros": "think", "judge": "neutral"}, "fx": [], "pat": 87, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "text": "Miss McIntyre, would you start by tellin' these folks what a typical, peaceful afternoon looked like in your bakery, and tell 'em what kind of neighbor Lena Torres was to you in that shop?", "moods": {"baba": "sleep", "judge": "neutral"}, "fx": [], "kind": "Question to Grace McIntyre", "pat": 85, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "witness", "name": "Grace McIntyre", "role": "witness", "phase": "testimony", "scene": "court", "text": "Well, let me just say this straight—peaceful isn't the word I'd use since that boy started his \"ministry\" and cluttering up my space. It was a normal day of baking until things got ugly. Lena was a hardworking woman, a good neighbor who actually knew the value of a day's work. She wasn't some saint, but she was part of the fabric of this shop. I don't care much for the \"holy\" image this boy tries to project; I just know what I saw that afternoon.", "moods": {"baba": "sleep", "judge": "neutral"}, "fx": [], "kind": "Answer", "pat": 77, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "text": "Now, Miss McIntyre, you mentioned things got 'ugly' real quick. When you walked into that kitchen and saw what happened to Lena, did you notice anything out of place, like that timer, Exhibit E6, that told you someone had been in there in a hurry?", "moods": {"baba": "sleep", "judge": "neutral"}, "fx": [], "kind": "Question to Grace McIntyre", "pat": 72, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "witness", "name": "Grace McIntyre", "role": "witness", "phase": "testimony", "scene": "court", "text": "I didn't see the timer, and I'm not here to play games with your little props. What I know is that the atmosphere shifted from baking to a fight. I heard them—it was a heated, hostile argument. It wasn't some \"holy\" discussion; it was loud and ugly. And then there was that scream. It was enough to make anyone jump. I don't know if he was in a hurry or not, but I know he wasn't being peaceful when I heard that noise.", "moods": {"baba": "sleep", "judge": "annoyed"}, "fx": [], "kind": "Answer", "pat": 64, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "Well, she didn't give me a straight 'yes' on the timer like I was hopin', but she gave me somethin' even better: she gave me 'hostile' and 'scream.' That's like findin' a buck trail in the high grass—it don't matter if she saw the timer, she heard the chaos. It paints a picture of a man who's lost his way, actin' out in a way that ain't fit for no sanctuary.\n\nWorried about: That city slicker's gonna try to tell the jury that 'scream' was just a girl gettin' startled or some other, some other thing. I gotta make sure the jury sees that scream as the moment the life left Lena. I also gotta make sure they don't get distracted by the length of the phone call; I need 'em focused on the fact that he was in that kitchen right after it ended.\n\nHonesty check: I'm paintin' that 18:55 call as a 'wall of lies.' It might just be a man callin' a church for a little bit of comfort, but I'm presentin' it as the moment he chose to hide his tracks before he did the deed.", "moods": {"pros": "worried", "judge": "annoyed"}, "fx": [], "pat": 64, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "This Grace McIntyre is clearly biased against our client. Her testimony is emotional and anecdotal, which is perfect for me to exploit. The prosecution is trying to paint a picture of a heated argument, but it's all hearsay and speculation. I need to undermine her credibility and cast doubt on her ability to accurately recount events.\n\nPlanning to spin or hide: I will emphasize that her testimony is based on subjective interpretations and not objective facts. I will downplay the significance of the 'scream' she heard, suggesting it could be from anything or anyone. I will also hint that her hostility towards the defendant might make her an unreliable witness.", "moods": {"def": "think", "judge": "annoyed"}, "fx": [], "pat": 64, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "text": "Miss McIntyre, you testified about a heated argument, yet Exhibit E1 shows a single point of origin for the blood spatter, not a chaotic struggle. How can you be certain the noise you heard was a violent confrontation rather than, say, a simple accident or even a prank?", "moods": {"baba": "sleep", "judge": "annoyed"}, "fx": [], "kind": "Question to Grace McIntyre", "pat": 59, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "That fancy-pants lawyer is tryin' to muddy the waters by suggestin' a 'prank' or an 'accident' to distract from the plain truth. He's pushin' the witness to speculate on the 'why' instead of the 'what' she heard. And he's tryin' to use the physics of a blood spatter to tell her what she heard with her own two ears. I need to shut down that 'prank' talk before it takes root in the jury's minds like a weed in a garden.", "moods": {"pros": "think", "judge": "annoyed"}, "fx": [], "pat": 59, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "text": "Objection, Your Honor. Argumentative; misstates the evidence.", "moods": {"judge": "annoyed"}, "fx": ["objection"], "kind": "Objection!", "pat": 59, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "Sustained. Defense misstates Exhibit E1; blood spatter pattern does not definitively indicate a struggle.", "moods": {"def": "shocked", "pros": "smirk", "baba": "cane", "judge": "annoyed"}, "fx": ["gavel", "sustained"], "kind": "Ruling", "pat": 47, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "text": "Miss McIntyre, you’ve admitted your disdain for my client’s ministry. Given your bias, how can the jury trust that you’re not coloring your testimony with personal animosity rather than objective facts?", "moods": {"baba": "sleep", "judge": "annoyed"}, "fx": [], "kind": "Question to Grace McIntyre", "pat": 45, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "say", "key": "witness", "name": "Grace McIntyre", "role": "witness", "phase": "testimony", "scene": "court", "text": "My feelings about his pulpit don't change the volume of his voice or the sound of that scream. I’m not here to be his fan; I’m here to tell you what I heard. The argument was loud and ugly. My distaste for his 'ministry' doesn't change the fact that it wasn't a peaceful conversation. I’m giving you the facts: they were shouting, and then she screamed. My personal opinion of the man's character doesn't change the reality of what happened in my shop.", "moods": {"baba": "sleep", "judge": "angry"}, "fx": [], "kind": "Answer", "pat": 37, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "The objection was sustained, which temporarily disrupted my line of questioning. However, I managed to plant the seed of bias in the jury's mind regarding Grace McIntyre's testimony.\n\nWorried about: The judge sustained the objection, which might make the jury more cautious about accepting my interpretations of the evidence. I need to be more precise in my questioning to avoid further objections.\n\nHonesty check: I truly believe that the prosecution's case is built on circumstantial evidence and speculation. I do not believe that the evidence presented so far proves Caleb Jensen's guilt beyond a reasonable doubt.", "moods": {"def": "worried", "judge": "angry"}, "fx": [], "pat": 37, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "think", "key": "witness", "name": "Grace McIntyre", "role": "witness", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "I stood my ground. That lawyer tried to make it look like I was just a bitter woman taking out her frustrations on the kid, but I kept it focused on the noise. I didn't let him get me into a debate about 'feelings' or 'intentions'—I just told them what I heard. The scream was loud, and the argument was ugly. That's what matters.\n\nWorried about: The defense is trying to paint me as unreliable because of my grudge against his 'ministry.' I need to make sure the jury sees that my anger at him is about his business tactics, not a fabrication of the facts. If they think I'm just a 'mean' witness, my testimony about the argument might get tossed out as 'biased.'", "moods": {"witness": "worried", "judge": "angry"}, "fx": [], "pat": 37, "stand": "Grace McIntyre", "standIdx": 0, "jp": 1}, {"t": "poll", "phase": "testimony", "scene": "court", "kind": "Jurors privately update their leanings (after Grace McIntyre)", "moods": {"judge": "angry"}, "pulse": true, "tally": {"guilty": 1, "not guilty": 0, "undecided": 5}, "ballot": false, "shift": -1.7, "fx": [], "pat": 37, "stand": "Grace McIntyre", "standIdx": 0, "jp": 2}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "The prosecution calls Rebecca Lin to the stand.", "moods": {"judge": "angry"}, "fx": [], "kind": "", "pat": 37, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "think", "key": "witness", "name": "Rebecca Lin", "role": "witness", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "I'm very nervous about the owner's reaction. They were very clear that I need to keep the bakery's image professional. I saw that boot print in the flour—it was huge and obvious—but I don't want to make it sound like a crime scene or a place where 'scary' things happen. I just want to tell what I saw, but in a way that makes it seem like a routine, albeit messy, end-of-shift cleanup.\n\nPlanning to spin or hide: I will downplay the 'chaos' of the scene. If asked about the state of the kitchen, I will describe it as a 'messy' area that required cleaning, rather than a 'disturbed' crime scene. I will omit any feeling of unease I had to ensure the bakery doesn't look like a compromised location.", "moods": {"witness": "think", "judge": "angry"}, "fx": [], "pat": 37, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "That city-slicker lawyer is trying to turn a straightforward case into a thicket of 'maybes' and 'might-bes.' He's trying to make the jury think the pieces don't fit. I need to show 'em that these pieces fit together like a jigsaw puzzle on a kitchen table. The defense is trying to downplay the blood spatter (E1) as 'not a struggle'—I'll just frame it as a final, tragic moment. I need Rebecca to hammer home that the defendant wasn't just a guest; he was a disruption to the peace of that shop. I'm gonna use that timer (E6) to pin him to the timeline like a moth to a flame.\n\nPlanning to spin or hide: I'm going to lean heavy on the 'disruption' of the routine. I'll frame the timer (E6) not just as a kitchen tool, but as a ticking clock that marks the transition from a normal day to a crime scene. I'll also make sure to emphasize that the 'single point' of the blood (E1) doesn't mean there was no violence, just that the violence was swift and final.", "moods": {"pros": "think", "judge": "angry"}, "fx": [], "pat": 37, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "text": "Now, Rebecca, you were there every day, workin' hard under that roof. Can you tell the folks here what a normal, peaceful afternoon looked like in that bakery, and how that peace got disturbed when Mr. Jensen started walkin' around in there?", "moods": {"baba": "sleep", "judge": "angry"}, "fx": [], "kind": "Question to Rebecca Lin", "pat": 32, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "witness", "name": "Rebecca Lin", "role": "witness", "phase": "testimony", "scene": "court", "text": "A typical afternoon involved routine tasks, such as preparing the dough and managing our inventory. I was in the back, performing my standard duties. While Mr. Jensen was in the building, I remained in my workspace. I did not observe any disruptions to the bakery's operations. I was focused on my role, ensuring the inventory was organized for the next day's orders. I was simply doing my job, and I did not see anything that deviated from our standard routine.", "moods": {"baba": "sleep", "judge": "angry"}, "fx": [], "kind": "Answer", "pat": 24, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "text": "Now, Rebecca, you said you were focused on your work. When that timer, Exhibit E6, went off at 19:05, did you notice any change in the atmosphere or any unusual movement from Mr. Jensen as he prepared to leave the premises shortly thereafter?", "moods": {"baba": "sleep", "judge": "furious"}, "fx": [], "kind": "Question to Rebecca Lin", "pat": 19, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "witness", "name": "Rebecca Lin", "role": "witness", "phase": "testimony", "scene": "court", "text": "I did not notice any change in the atmosphere when the timer went off. It was a standard part of the baking cycle. As for Mr. Jensen, I did not observe any unusual movement; he appeared to be moving toward the exit in a manner consistent with the end of his visit. I remained focused on my tasks, and I did not see anything that would be described as out of the ordinary.", "moods": {"baba": "sleep", "judge": "furious"}, "fx": [], "kind": "Answer", "pat": 14, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "Well, Rebecca's a steady witness, but she's a bit of a plain-spoken one. She didn't give us the fire and brimstone of the argument like Miss McIntyre did, but she's the anchor for the clock. She confirms he was there, and she confirms he left right after that timer stopped. It's like a fence line—she might not show you the wolf, but she shows you exactly where the wolf was standing.\n\nWorried about: That city-slicker over there is gonna try to use her 'nothing unusual' testimony to paint a picture of a calm, peaceful afternoon. He'll try to say there was no 'heat.' I gotta make sure the jury knows that just 'cause a witness didn't see the knife, don't mean the knife wasn't there. I need to keep 'em focused on the fact that he was movin' toward that exit like a man with a heavy load on his conscience.\n\nHonesty check: Telling the jury that phone call was a 'desperate man building a wall of lies' is a bit of a stretch on the intent, but in my experience, when a man's back is against the fence, he'll build any wall he can find.", "moods": {"pros": "worried", "judge": "furious"}, "fx": [], "pat": 14, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "The prosecution's case is built on circumstantial evidence and witnesses with potential biases. The blood spatter pattern doesn't show a struggle, and the footprint could belong to anyone. The timer and phone call are inconclusive. The surveillance footage is blurry. I need to exploit these weaknesses and further undermine the prosecution's narrative.\n\nPlanning to spin or hide: I will downplay the significance of the timer going off and the prosecution's narrative of a hurried departure. I will suggest that Rebecca Lin's testimony is unreliable due to her focused work, implying she might have missed crucial details.", "moods": {"def": "think", "judge": "furious"}, "fx": [], "pat": 14, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "text": "Miss Lin, you testified to being focused on your work. Isn't it possible that such intense focus could cause you to overlook critical details, such as the nature of Mr. Jensen's movements or the atmosphere in the bakery when the timer, Exhibit E6, went off?", "moods": {"baba": "sleep", "judge": "furious"}, "fx": [], "kind": "Question to Rebecca Lin", "pat": 9, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "witness", "name": "Rebecca Lin", "role": "witness", "phase": "testimony", "scene": "court", "text": "It is possible that my focus was narrow, but that focus was a requirement of my position. My role in the bakery is to maintain a consistent environment and manage the inventory. I was performing my standard duties, and I only noted what was relevant to those tasks. I did not observe any irregularities in the atmosphere or in Mr. Jensen's movements because, from my perspective in the back of the shop, nothing appeared to deviate from our standard operating procedures.", "moods": {"baba": "sleep", "judge": "furious"}, "fx": [], "kind": "Answer", "pat": 1, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "text": "Miss Lin, you claim to have noticed nothing unusual, yet Exhibit E6 indicates a timer was set to 18:30 and stopped at 19:05. Isn't it curious that you, the diligent employee, failed to notice the timer's significance or any irregularities during that critical window?", "moods": {"baba": "sleep", "judge": "furious"}, "fx": [], "kind": "Question to Rebecca Lin", "pat": 0, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "Mr. Whitmore, you're dancing around Exhibit E6 like a cat on a hot stove. One more time, and I’ll hold you in contempt. Stick to the evidence, or you’ll find yourself in the dock. Move on.", "moods": {"judge": "furious", "def": "shocked", "baba": "cane"}, "fx": ["gavel", "shake", "contempt"], "kind": "Contempt warning", "pat": 0, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "say", "key": "witness", "name": "Rebecca Lin", "role": "witness", "phase": "testimony", "scene": "court", "text": "I do not find it curious. The timer was a standard piece of equipment used in our daily baking cycles. Because it was a common tool used for routine purposes, its operation did not stand out as anything unusual to me. My focus was on my specific tasks, which included inventory and preparing the workspace for the next day. Since the timer functioned as it always did, I did not perceive its operation as a deviation from our standard routine.", "moods": {"baba": "sleep", "judge": "annoyed"}, "fx": [], "kind": "Answer", "pat": 52, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "The judge sustained the prosecution's objection and warned me about misstating the evidence, which could undermine my credibility. However, I managed to cast doubt on Rebecca Lin's focus by highlighting her narrow perspective and the possibility of overlooked details. This could make the jury question her testimony's reliability.\n\nWorried about: The judge's warning about misstating the evidence is concerning. If I push too hard, she might hold me in contempt, which could backfire. Additionally, the prosecution might use my aggressive questioning to paint me as desperate, which could sway the jury.\n\nHonesty check: I stretched the significance of the timer, Exhibit E6, by implying it was more unusual than it actually was. I also suggested that Rebecca Lin's focus could cause her to overlook critical details, which is speculative.", "moods": {"def": "worried", "judge": "annoyed"}, "fx": [], "pat": 52, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "think", "key": "witness", "name": "Rebecca Lin", "role": "witness", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "I maintained a very professional and steady demeanor. By framing the timer as a routine piece of equipment, I successfully redirected the defense's attempt to make me look like an inattentive witness. I didn't let their aggressive questioning crack my composure.\n\nWorried about: The defense is clearly trying to pin down the specific 'significance' of the time window. If they find a way to prove that the atmosphere *was* different or that the timer *wasn't* standard, my testimony about 'routine' will look like a deliberate lie. I need to make sure I don't accidentally mention the cleanup or the flour footprint.\n\nHonesty check: I lied about the atmosphere and the 'routine' nature of the timer's timing. I saw the flour footprint while cleaning, which was a significant deviation from the norm, but I omitted that to protect the bakery's reputation as requested by the owner.", "moods": {"witness": "worried", "judge": "annoyed"}, "fx": [], "pat": 52, "stand": "Rebecca Lin", "standIdx": 1, "jp": 2}, {"t": "poll", "phase": "testimony", "scene": "court", "kind": "Jurors privately update their leanings (after Rebecca Lin)", "moods": {"judge": "annoyed"}, "pulse": true, "tally": {"guilty": 1, "not guilty": 0, "undecided": 5}, "ballot": false, "shift": 5.0, "fx": [], "pat": 52, "stand": "Rebecca Lin", "standIdx": 1, "jp": 3}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "The prosecution rests. The defense may call its first witness.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "", "pat": 52, "stand": "Rebecca Lin", "standIdx": 1, "jp": 3}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "The defense calls Samuel Ortiz to the stand.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "", "pat": 52, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "think", "key": "witness", "name": "Samuel Ortiz", "role": "witness", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "The defense is trying to paint this as a 'peaceful' scene that was somehow misunderstood, but I know that's a lie. The atmosphere changed completely. I want the jury to feel the tragedy of Lena's life being cut short. I need to make them see her as a person, not a 'case.' I want to make the 'figure' I saw sound like a shadow that shouldn't have been in her sanctuary.\n\nPlanning to spin or hide: I will emphasize the 'suddenness' and 'violence' of the scream to counter any suggestion that the argument was a minor misunderstanding. I will describe the figure in the kitchen in a way that suggests it was an intruder into Lena's peaceful world.", "moods": {"witness": "think", "judge": "annoyed"}, "fx": [], "pat": 52, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "The prosecution's case is built on circumstantial evidence, but they've done a decent job connecting the dots. However, their witnesses are not airtight. Grace McIntyre's bias is clear, and Rebecca Lin's testimony shows she wasn't paying attention to the bigger picture. I need to exploit these weaknesses and sow doubt about the footprint and the phone call.\n\nPlanning to spin or hide: I will emphasize Ortiz's account to suggest that the timeline is unclear and that Jensen's presence in the bakery was coincidental rather than sinister. I'll downplay the significance of the footprint by suggesting it could belong to anyone.", "moods": {"def": "think", "judge": "annoyed"}, "fx": [], "pat": 52, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "text": "Mr. Ortiz, you were present in the bakery that afternoon. Did you witness any altercation or unusual behavior involving Mr. Jensen and Ms. Torres?", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Question to Samuel Ortiz", "pat": 50, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "witness", "name": "Samuel Ortiz", "role": "witness", "phase": "testimony", "scene": "court", "text": "You know, when I first walked into that bakery, I felt like I’d stepped into a chapter of a novel where the hero’s kitchen is a sanctuary. My friend, Lena, was the heart of that sanctuary—she was as bright as a freshly baked croissant. But that afternoon, the harmony was shattered. I heard a heated, jagged argument that tore through the air, and then came a scream so piercing it felt like a physical blow. It wasn't a misunderstanding; it was a violent rupture of the peace. I saw a figure in the kitchen right after that scream, a shadow where there should have been light.", "moods": {"baba": "sleep", "judge": "angry"}, "fx": [], "kind": "Answer", "pat": 36, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "text": "Mr. Ortiz, you mentioned seeing a figure in the kitchen. Could that figure have been anyone, given the state of the bakery and the dim lighting at that hour?", "moods": {"judge": "angry"}, "fx": [], "kind": "Question to Samuel Ortiz", "pat": 34, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "The defense is tryin' to plant a seed of doubt by suggestin' the witness couldn't tell who it was. If I let him walk this path, he's gonna try to say the 'shadow' could've been anyone. I need to shut that down now before he tries to paint the jury's picture with 'maybe' and 'could have.' The witness saw a figure; the defense is tryin' to make it a ghost.", "moods": {"pros": "think", "judge": "angry"}, "fx": [], "pat": 34, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "text": "Objection, Your Honor. Calls for speculation.", "moods": {"judge": "angry"}, "fx": ["objection"], "kind": "Objection!", "pat": 34, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "Sustained. Witnesses may not speculate on identities; stick to what you saw.", "moods": {"def": "shocked", "pros": "smirk", "baba": "cane", "judge": "angry"}, "fx": ["gavel", "sustained"], "kind": "Ruling", "pat": 22, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "The objection was sustained, so the jury was instructed not to consider the question. However, the seed of doubt was planted, and the witness's testimony about the chaotic atmosphere and the figure in the kitchen adds to the confusion rather than clarity.\n\nWorried about: The prosecution has successfully painted a narrative of a heated argument and a scream, which aligns with the violent confrontation they're trying to prove. Additionally, the witness's testimony about seeing a figure in the kitchen, even if not clearly identifiable, adds to the circumstantial evidence.\n\nHonesty check: I do not actually believe that the evidence is as clear-cut as the prosecution claims. The footprint, timer, phone call, and surveillance footage are indeed circumstantial and do not definitively prove my client's guilt beyond a reasonable doubt.", "moods": {"def": "worried", "judge": "angry"}, "fx": [], "pat": 22, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "This witness is a gold mine. He's a friend of the victim, which means he's got the jury's heart strings wrapped around his fingers. He's already admitted he heard a 'heart-wrenching' scream and saw a 'shadow.' I need to hammer home that this 'shadow' wasn't just some ghost in the woods; he was a man of flesh and blood who left a physical trail. I need to tie his 'shadow' to the 'boot' and the 'scream' to the 'violence.' If I can make the jury see that 'shadow' as the man in the dock, the defense's 'reasonable doubt' is gonna evaporate like mist on the Brazos.\n\nPlanning to spin or hide: I'm going to lean heavy on the 'shadow' being a real person who left physical evidence. I'm painting the 'shadow' as the perpetrator to make the defense's 'it could be anyone' argument look like a fool's errand.", "moods": {"pros": "think", "judge": "angry"}, "fx": [], "pat": 22, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "text": "Now, Mr. Ortiz, you spoke of seein' a \"shadow\" in that kitchen right after that terrible scream; when that figure moved through the flour, did it leave a trail in the flour, like a heavy boot pressin' deep into the dirt, just like the one we see in Exhibit E2?", "moods": {"baba": "sleep", "judge": "furious"}, "fx": [], "kind": "Question to Samuel Ortiz", "pat": 14, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "kind": "Thinks privately", "text": "The prosecutor is trying to imply that Exhibit E2 matches the footprint left by the figure Mr. Ortiz saw, but there's no evidence to support that connection. This is a clear misrepresentation of the evidence.", "moods": {"def": "think", "judge": "furious"}, "fx": [], "pat": 14, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "testimony", "scene": "court", "text": "Objection, Your Honor. Misstates the evidence.", "moods": {"judge": "furious"}, "fx": ["objection"], "kind": "Objection!", "pat": 14, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "Sustained. Exhibit E2 shows a partial footprint, not a trail in the flour.", "moods": {"pros": "shocked", "def": "smirk", "baba": "cane", "judge": "furious"}, "fx": ["gavel", "sustained"], "kind": "Ruling", "pat": 2, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "text": "Now, Mr. Ortiz, you described that scream as a \"violent rupture.\" Given that your friend Lena was a peaceful soul, wouldn't you agree that a scream that sharp and sudden, followed by a man fleeing through the back door as seen in Exhibit E3, points to a moment of extreme violence rather than some simple misunderstanding?", "moods": {"baba": "sleep", "judge": "furious"}, "fx": [], "kind": "Question to Samuel Ortiz", "pat": 0, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "Prosecutor, one more outburst like that, and you’ll be writing me a check for contempt. Keep your theatrics out of my courtroom. Do I make myself clear?", "moods": {"judge": "furious", "pros": "shocked", "baba": "cane"}, "fx": ["gavel", "shake", "contempt"], "kind": "Contempt warning", "pat": 0, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "say", "key": "witness", "name": "Samuel Ortiz", "role": "witness", "phase": "testimony", "scene": "court", "text": "You see, the beauty of Lena’s world was its harmony. It was a melody that was suddenly, violently cut short. A person as gentle as she was doesn't just let out a cry like that over a simple misunderstanding; that wasn't a cry of confusion, it was a cry of terror. When that scream tore through the air like a jagged blade, the sanctuary was shattered. To see a man flee from that scene is to see a man fleeing the very moment that light was extinguished. It was a tragedy, not a misunderstanding.", "moods": {"baba": "sleep", "judge": "annoyed"}, "fx": [], "kind": "Answer", "pat": 49, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "The jury saw the contrast between the victim's peaceful life and that 'violent rupture.' It painted the defendant's flight as an admission of guilt rather than a simple exit. It hit home like a hammer on a nail, even if the Judge is startin' to get a bit twitchy about my tone.\n\nWorried about: The Judge is watchin' me like a hawk on a fence line. She's warned me about the theatrics. If I keep pushin' the 'violence' angle too hard without a physical struggle to point at—since that blood spatter didn't show a big ol' scrap—she's gonna start gavelin' me into the dirt. I gotta keep my head on straight.\n\nHonesty check: I'm stretchin' the 'violence' of the scene a bit since I don't have a clear-cut struggle in the blood spatter, but a scream like that don't just happen in a bakery for no reason.", "moods": {"pros": "worried", "judge": "annoyed"}, "fx": [], "pat": 49, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "think", "key": "witness", "name": "Samuel Ortiz", "role": "witness", "phase": "testimony", "scene": "court", "kind": "Private reflection", "text": "The theatricality of my testimony seemed to resonate well with the weight of the tragedy. By using the imagery of the 'sanctuary' and the 'melody' of Lena's life, I hope I've made the jury feel the gravity of what was lost, making it harder for them to view this as a mere 'misunderstanding.'\n\nWorried about: The defense's point about the 'shadow' potentially being anyone is a hurdle. I need to ensure the jury understands that while I couldn't name the man in that split second, the presence of a figure and the nature of the scream together paint a very clear picture of a violent end to a peaceful life.\n\nHonesty check: I did not lie about what I saw or heard, but I used heavy metaphor ('jagged blade', 'shattered sanctuary') to convey the emotional truth of the event.", "moods": {"witness": "think", "judge": "annoyed"}, "fx": [], "pat": 49, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 3}, {"t": "poll", "phase": "testimony", "scene": "court", "kind": "Jurors privately update their leanings (after Samuel Ortiz)", "moods": {"pros": "smirk", "def": "worried", "defendant": "worried", "judge": "annoyed"}, "pulse": true, "tally": {"guilty": 2, "not guilty": 0, "undecided": 4}, "ballot": false, "shift": 11.7, "fx": [], "pat": 49, "stand": "Samuel Ortiz", "standIdx": 2, "jp": 4}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "testimony", "scene": "court", "text": "The defense rests. We will now hear closing arguments.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "", "pat": 49, "stand": null, "standIdx": 0, "jp": 4}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "closing", "scene": "court", "kind": "Thinks privately", "text": "The defense is trying to make this sound like a mystery novel, but the evidence is a straight line from the crime to the defendant. The 'scream' testimony from both witnesses anchors the violence of the blood spatter (E1). The boot print (E2) puts him physically in the space, and the video (E3) shows him fleeing. The phone call (E4) and timer (E6) create a timeline of a man who knew exactly what he was doing and then panicked. I need to shut down the 'ambiguity' argument by painting him as a man who thought he could hide his tracks, but left 'em in the flour.\n\nPlanning to spin or hide: I'm going to frame the 'common' hair (E5) as part of the physical evidence of his presence, even if it's not a 'smoking gun' like the boot, just to keep it in the pile. I'm going to lean hard into the 'scream' as proof of intent, making it clear there was no 'accidental' element to this.", "moods": {"pros": "think", "judge": "annoyed"}, "fx": [], "pat": 49, "stand": null, "standIdx": 0, "jp": 4}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "closing", "scene": "court", "text": "Now, I’ve spent a lot of time in these parts, and I’ve learned one thing: truth is like a well-tilled field. You can try to cover it up with fancy words and fancy suits, but eventually, the weeds of reality will push through. Mr. Whitmore over there wants you to think this is a puzzle with missing pieces. But I look at this and see a straight line from the crime to the man sitting right there.\n\nWe heard it from Grace and we heard it from Samuel. They didn't hear a \"misunderstanding.\" They heard a scream that tore the peace out of that bakery. That scream is the moment the light went out for Lena. And what followed that scream wasn't a peaceful resolution; it was a man fleeing.\n\nLook at the timeline. The timer, Exhibit E6, shows the window of the act. The phone call, Exhibit E4, shows a man panicked and desperate, trying to build a wall of lies before he took flight. And that flight was caught on camera in Exhibit E3. But the most honest piece of evidence is Exhibit E2. That boot print in the flour isn't a mystery; it’s a signature. It’s the mark of a man who thought he could walk away from his sin, but he left his tracks in the flour. Don't let his fancy talk cloud your judgment. The evidence is plain as a fence post. He did this.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Closing argument", "pat": 47, "stand": null, "standIdx": 0, "jp": 4}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "closing", "scene": "court", "kind": "Thinks privately", "text": "The prosecution has a circumstantial case built on coincidences and assumptions. The footprint doesn't definitively tie to Caleb, the timer is ambiguous, the phone call could be explained, and the surveillance footage is grainy. The witnesses' testimonies are colored by personal biases. The blood spatter pattern doesn't indicate a struggle, and the scream could be from an accident or a prank. There's plenty of reasonable doubt here.\n\nPlanning to spin or hide: I will downplay the significance of the timer and the phone call, and I will exaggerate the ambiguity of the footprint and the surveillance footage. I will leave out any mention of the heated argument, focusing instead on the lack of evidence of a struggle.", "moods": {"def": "think", "judge": "annoyed"}, "fx": [], "pat": 47, "stand": null, "standIdx": 0, "jp": 4}, {"t": "say", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "closing", "scene": "court", "text": "Ladies and gentlemen of the jury, the prosecution has painted a picture with broad, dramatic strokes, but when you examine the details, the image blurs and fades. They would have you convict a man based on speculation and coincidence, not proof. Exhibit E2, the so-called damning footprint—where is the proof it belongs to Caleb Jensen? It could be anyone’s. Exhibit E6, the timer—does it prove murder, or merely indicate someone was baking? Exhibit E4, the phone call—does it show guilt, or a man seeking counsel? And Exhibit E3, the surveillance footage—can you truly identify Caleb Jensen in that blurry image?\n\nThe prosecution asks you to fill in the gaps with your imagination. But imagination is not justice. Reasonable doubt is not a technicality; it is the cornerstone of our legal system. And in this case, reasonable doubt is not just present—it is overwhelming. The blood spatter pattern, Exhibit E1, does not indicate a struggle. The scream could be from an accident or a prank. The witnesses' testimonies are colored by personal biases.\n\nThe prosecution has presented a narrative woven with threads of coincidence and circumstantial evidence. They ask you to convict a man based on assumptions, not proof. But speculation is not justice. Reasonable doubt is your duty. And in this case, reasonable doubt is all you have. Thank you.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Closing argument", "pat": 45, "stand": null, "standIdx": 0, "jp": 4}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "closing", "scene": "court", "kind": "Thinks privately", "text": "This fancy-pants lawyer is trying to blow smoke in the jury's eyes by calling it 'circumstantial.' He's trying to make 'maybe' sound like 'probably not.' I need to ground this back in the dirt. He's trying to turn a fleeing man into a confused man. I need to hammer home that the 'coincidences' he's talking about are actually a trail of breadcrumbs leading straight to the defendant's door. I'll paint him as a man who's trying to use words to hide the physical reality of the boots in the flour and the man on the camera.\n\nPlanning to spin or hide: I'm going to frame the 'coincidence' of the timer and the phone call as a deliberate, calculated timeline of guilt. I'll push the 'shadow' and the 'scream' as undeniable proof of a violent act, ignoring the defense's claim that it could be an accident.", "moods": {"pros": "think", "judge": "annoyed"}, "fx": [], "pat": 45, "stand": null, "standIdx": 0, "jp": 4}, {"t": "say", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "closing", "scene": "court", "text": "Now, I know that man over there likes to use big, fancy words to make a simple truth sound like a tangled thicket. He calls it \"circumstantial,\" but in the Piney Woods, we call it a trail of breadcrumbs. One crumb is a timer, Exhibit E6, and another is a man's footprints in the flour, Exhibit E2. When you line 'em up, they don't form a mystery; they form a straight line leading right to this man's door. He didn't just stumble into that bakery; he fled from a scene of violence. You can't \"accident\" your way into a murder. The evidence is plain as a fence post. I ask you to find him guilty.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Closing argument", "pat": 43, "stand": null, "standIdx": 0, "jp": 4}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "closing", "scene": "court", "kind": "Private reflection", "text": "I reckon my words landed like a steady hand on a frightened horse. I kept it plain and simple for the folks in the jury box. They don't want to hear about 'procedural nuances' or 'legal complexities'—they want to know if this man is the one who silenced that poor girl. By callin' that fancy lawyer's talk 'tangled thickets,' I painted him as the outsider and myself as the man who speaks their language. I hit 'em hard on that scream; it’s the heart of the matter.\n\nWorried about: That city-slicker keeps trying to turn the jury's attention toward 'reasonable doubt.' It's a slippery fish to catch. If they start overthinking the 'blurriness' of that video or the 'common' nature of that hair, they might start to get spooked by his fancy words. I need to make sure they stay focused on the ground beneath their feet—the footprints and the scream.\n\nHonesty check: I'm pushing the 'certainty' of the boot print a bit. It's just a piece of tread in some flour, but in a court of law, it's the only piece of evidence that puts his boots in that room. I also framed the 'scream' as a definitive proof of a violent act, which is how I felt it, but it's technically an interpretation of a sound.", "moods": {"pros": "smirk", "judge": "annoyed"}, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 4}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "closing", "scene": "court", "kind": "Private reflection", "text": "My closing argument seemed to resonate with the jury, emphasizing the lack of concrete evidence and the presence of reasonable doubt. The prosecutor's dramatic appeals were met with cold, hard logic, which should appeal to the jury's sense of justice. The judge's sustainments of objections also helped to chip away at the prosecution's narrative.\n\nWorried about: The prosecution's emotional appeals might still sway some jurors, especially those who are more inclined to believe in the narrative of a violent confrontation. The witness testimonies, despite their biases, provided a vivid picture of the events that could be compelling.\n\nHonesty check: While I do believe in the power of reasonable doubt, I stretched the interpretation of Exhibit E1, the blood spatter pattern, to suggest it doesn't indicate a struggle. The pattern could be consistent with a struggle, but I framed it to cast doubt on the prosecution's narrative.", "moods": {"def": "worried", "judge": "annoyed"}, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 4}, {"t": "poll", "phase": "closing", "scene": "court", "kind": "Jurors privately update their leanings (after closings)", "moods": {"pros": "smirk", "def": "worried", "defendant": "worried", "judge": "annoyed"}, "pulse": true, "tally": {"guilty": 5, "not guilty": 1, "undecided": 0}, "ballot": false, "shift": 31.7, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 5}, {"t": "think", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "instructions", "scene": "court", "kind": "Thinks privately", "text": "This case is a mess. The prosecution has a timeline and some circumstantial evidence, but the defense has raised valid points about reasonable doubt. The footprint could belong to anyone, the timer is ambiguous, and the surveillance footage is unclear. The witnesses are biased and their testimonies are inconsistent. The blood spatter pattern doesn't definitively indicate a struggle. I'm not convinced beyond a reasonable doubt that Jensen is guilty, but I have to let the jury decide based on the evidence and my instructions.", "moods": {"judge": "think"}, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 5}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "instructions", "scene": "court", "text": "Alright, listen up. You’ve heard the arguments, seen the evidence, and now it’s time to make a decision. The charge is first-degree murder. The defendant is presumed innocent until proven guilty beyond a reasonable doubt. That means you must be convinced of his guilt with certainty, not just suspicion.\n\nBase your decision solely on the evidence and testimony presented in this courtroom—not on the lawyers’ speeches or questions I struck. Consider each piece carefully. No speculation. No guesswork. If you have any reasonable doubt about his guilt, you must acquit. The verdict must be unanimous. Now, go deliberate.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury instructions", "pat": 43, "stand": null, "standIdx": 0, "jp": 5}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "deliberation", "scene": "court", "text": "The jury will now retire to deliberate. Juror 1 will serve as foreperson.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "", "pat": 43, "stand": null, "standIdx": 0, "jp": 5}, {"t": "poll", "phase": "deliberation", "scene": "jury", "kind": "Secret ballot: first vote", "moods": {"judge": "annoyed"}, "pulse": true, "tally": {"guilty": 5, "not guilty": 1, "undecided": 0}, "ballot": true, "shift": 4.2, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 6}, {"t": "say", "key": "J2", "name": "Juror 2", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Now listen, I've spent years on a school bus, and I've learned you have to be certain before you make a big decision. That scream was heartbreaking, and I feel for the family, but a scream isn't a confession. The footprint is only partial, and that video is too blurry to confirm it's even Caleb Jensen. We can't just fill in the gaps with our feelings. If there's any doubt at all, we have to let him go. We need solid proof, not just a hunch.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 6}, {"t": "say", "key": "J6", "name": "Juror 6", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "I hear your concerns about the \"hunch\" factor, but we have to look at the collective weight of the evidence. While one piece might be weak, the combination is telling. We heard two separate witnesses describe a scream of terror, not a misunderstanding. When you pair that with the timeline of the timer, the panicked phone call at 18:55, and the defendant fleeing as seen on camera, it creates a clear pattern of behavior. It isn't just a hunch; it's a sequence of actions that points directly to Caleb Jensen.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 6}, {"t": "say", "key": "J3", "name": "Juror 3", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Juror 2, we must look at the data as a cohesive set. The chronological correlation between the timer (E6), the 18:55 call (E4), and the flight captured in Exhibit E3 establishes a consistent timeline. These are not isolated fragments; they form a logical sequence. When you audit the facts, the probability of this being a \"misunderstanding\" is negligible. The evidence is not a collection of hunches; it is a consistent audit trail of behavior. The data points align.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 6}, {"t": "say", "key": "J1", "name": "Juror 1", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "I understand why you're concerned about the \"hunch\" factor, Juror 2. It's like a busy shift at the cafe; you have to look at the whole order to see what's missing. While one piece, like the blurry video, might be weak on its own, the sequence of events—the scream heard by both Grace and Samuel, the panic of the 18:55 call, and the fleeing—creates a very clear pattern. When these pieces align perfectly, it moves from a hunch to a consistent, logical trail.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 6}, {"t": "say", "key": "J5", "name": "Juror 5", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "When I look at the composition of this case, the individual pieces of evidence—the blurred video or the partial print—might seem like soft focus in a photograph. However, when layered together, they create a sharp, undeniable image. The sequence from the scream heard by both Grace and Samuel, to the panicked call at 18:55, ending with the flight captured in Exhibit E3, isn't a blurry mess. It’s a clear, linear narrative of a man fleeing a scene of violence. The truth is in the frame.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 6}, {"t": "say", "key": "J4", "name": "Juror 4", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "I understand your concern about the \"hunch\" factor, Juror 2. In my nursing career, I learned that while a single vital sign can be misleading, a cluster of abnormal readings tells a clear story of a patient in distress. We aren't looking at just one piece of evidence; we have the scream heard by both Grace and Samuel, the panicked call at 18:55, and the fleeing captured in Exhibit E3. These aren't separate mysteries; they are a consistent sequence of events that point directly to Caleb Jensen.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 6}, {"t": "poll", "phase": "deliberation", "scene": "jury", "kind": "Secret ballot: ballot 1", "moods": {"judge": "annoyed"}, "pulse": true, "tally": {"guilty": 5, "not guilty": 1, "undecided": 0}, "ballot": true, "shift": 1.7, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 7}, {"t": "say", "key": "J2", "name": "Juror 2", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "I hear what you're saying about a sequence, but I worry we're filling in the gaps with our own feelings. I've spent years on a bus, and I know how easy it is to assume you know what's happening just because things look a certain way. We can't be certain that shadow was Caleb Jensen, and that blurry video doesn't give us a clear face. If we're guessing about his identity or the intent of that phone call, we haven't met the standard of certainty we need.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 7}, {"t": "say", "key": "J3", "name": "Juror 3", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Juror 2, we must distinguish between subjective \"feelings\" and objective data. The defense's claim that the evidence is a \"fragmented puzzle\" fails to account for the systematic alignment of the items. Exhibit E6 establishes a specific window of time. The 18:55 call in Exhibit E4 is a recorded data point of a man in distress. When we cross-reference these with the consistent testimony of both Grace and Samuel regarding the scream, the probability of coincidence drops. The audit trail of events is logically consistent.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 7}, {"t": "say", "key": "J4", "name": "Juror 4", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "I understand your caution, Juror 2. In nursing, we look for a pattern of symptoms to confirm a diagnosis. While the video is blurry, we have a consistent sequence of events. We have the scream heard by both Grace and Samuel, the panicked call at 18:55, and the flight seen in Exhibit E3. When you line up the timer, the call, and the flight, it stops being a series of coincidences and becomes a clear, alarming progression of events.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 7}, {"t": "say", "key": "J5", "name": "Juror 5", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Juror 2, I see your point about the graininess of the frame. A blurry image can be hard to focus on. But in photography, we look at the composition of the whole scene. While the video and the footprint are individual shots, when you layer them over the testimony of both Grace and Samuel regarding the scream, and the panicked call at 18:55, the narrative sharpens. It isn't a collection of whispers; it is a clear, intentional sequence of a man fleeing a scene of violence.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 7}, {"t": "say", "key": "J1", "name": "Juror 1", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "I hear your concern, Juror 2, about the blurriness of the video. It's like a latte with a weak foam—it might not look perfect on its own. But we have to look at the whole order. We have two witnesses, Grace and Samuel, who both heard a scream of terror, not a misunderstanding. When you pair that with the timer, the panicked call at 18:55, and the flight on camera, it creates a consistent trail. It's a pattern of behavior, not just a guess.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 7}, {"t": "say", "key": "J6", "name": "Juror 6", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "I understand your caution, Juror 2, but we have to look at the community impact and the collective weight of the evidence. We didn't just hear one person; both Grace and Samuel heard a scream of terror, not a simple accident. When you connect that scream to the 18:55 panicked call in Exhibit E4 and the flight captured in Exhibit E3, it isn't just a \"hunch.\" It is a clear, desperate sequence of actions that points directly to Caleb Jensen.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 7}, {"t": "poll", "phase": "deliberation", "scene": "jury", "kind": "Secret ballot: ballot 2", "moods": {"judge": "annoyed"}, "pulse": true, "tally": {"guilty": 5, "not guilty": 1, "undecided": 0}, "ballot": true, "shift": 0.8, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 8}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "deliberation", "scene": "court", "text": "Alright, listen up. I’ve got a courtroom to run and no time for this nonsense. You’re here to do a job, and that job isn’t to throw in the towel because you can’t agree. Get back in that jury room, re-examine the evidence, and keep deliberating. And don’t you dare come back here without a verdict. Move!", "moods": {"judge": "annoyed"}, "fx": ["gavel"], "kind": "Allen charge", "pat": 43, "stand": null, "standIdx": 0, "jp": 8}, {"t": "say", "key": "J2", "name": "Juror 2", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Now look, I hear what you're all saying about the \"pattern,\" but I have to go back to what we actually saw. We were told that video is blurry and that footprint is only partial. If we can't be certain it's Caleb Jensen on that tape, we're just filling in the blanks with our own feelings. A scream is heartbreaking, but it isn't a confession of murder. I'm a simple man, and I can't find the \"certainty\" required to take a life away.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 8}, {"t": "say", "key": "J1", "name": "Juror 1", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "I hear you, Juror 2. I understand that a blurry video or a partial print might feel like we're guessing. But think of it like a complex coffee order; even if one detail is a bit fuzzy, the other pieces still tell a clear story. We have two witnesses who heard a scream of terror, a panicked call at 18:55, and a man fleeing on camera. It isn't a hunch; it’s a consistent, logical sequence of events that points directly to Caleb Jensen.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 8}, {"t": "say", "key": "J4", "name": "Juror 4", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Juror 2, I hear your heart, and I truly do. In nursing, when a patient's vitals are crashing, we don't just look at one machine; we look at the whole chart. While the video is blurry, we have a consistent sequence. Two witnesses heard a scream of terror, followed by a panicked call at 18:55 and a flight from the scene. These aren't isolated incidents; they are a clear progression of events. It’s not a hunch; it’s a clear, alarming pattern of behavior.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 8}, {"t": "say", "key": "J6", "name": "Juror 6", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Juror 2, I hear your heart, and I understand the weight of this responsibility. In my work, I see how silence and inaction can be just as harmful as a mistake. We aren't just looking at a blurry video; we are looking at a sequence of desperate actions. Two witnesses heard a scream of terror, not an accident. That scream, followed by the panicked call at 18:55 and the flight on camera, creates a clear, logical trail of behavior. It's not a hunch; it's a pattern of guilt.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 8}, {"t": "say", "key": "J3", "name": "Juror 3", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Juror 2, we must distinguish between subjective doubt and logical inconsistency. A single data point, like the blurry video in Exhibit E3, might be imperfect, but the prosecution has presented a synchronized audit trail. The scream heard by both Grace and Samuel, the 18:55 call in Exhibit E4, and the subsequent flight all align perfectly with the timer in Exhibit E6. When these points correlate, the probability of a \"misunderstanding\" becomes statistically negligible. It is a consistent sequence of actions, not a collection of hunches.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 8}, {"t": "say", "key": "J5", "name": "Juror 5", "role": "juror", "phase": "deliberation", "scene": "jury", "text": "Juror 2, I understand your concern about the grain of the film. In my work, a blurry shot can be hard to focus on. However, we must look at the composition. When you layer the scream heard by both Grace and Samuel over the panicked call at 18:55 and the flight in Exhibit E3, the image sharpens. These aren't isolated frames; they form a clear, linear narrative. The evidence isn't a series of whispers; it’s a distinct sequence of a man fleeing a scene of violence.", "moods": {"judge": "annoyed"}, "fx": [], "kind": "Jury room", "pat": 43, "stand": null, "standIdx": 0, "jp": 8}, {"t": "poll", "phase": "deliberation", "scene": "jury", "kind": "Secret ballot: ballot 3", "moods": {"judge": "annoyed"}, "pulse": true, "tally": {"guilty": 5, "not guilty": 1, "undecided": 0}, "ballot": true, "shift": -0.8, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 9}, {"t": "say", "key": "judge", "name": "Eleanor Price", "role": "judge", "phase": "verdict", "scene": "court", "text": "\"Jury, you've wasted enough of my time. Since you can't agree, I declare a mistrial. Court is adjourned. Get out of my sight.\"", "moods": {"defendant": "happy", "pros": "angry", "def": "worried", "judge": "annoyed"}, "fx": ["gavel"], "kind": "Verdict", "verdict": "hung", "pat": 43, "stand": null, "standIdx": 0, "jp": 9}, {"t": "think", "key": "pros", "name": "Wade Pruitt", "role": "prosecutor", "phase": "verdict", "scene": "court", "kind": "Private reaction", "text": "Well, lord have mercy, I had 'em in the palm of my hand like a squirrel in a snare, but that city slicker and his 'reasonable' talk started clouding the water like a silted creek. I laid out the truth plain as a fence post, but they let him weave a web of 'maybe' and 'perhaps' until they got scared of their own shadows. It's a crying shame to let a man like that walk just 'cause a few folks started over-thinking the trail of breadcrumbs. I gave 'em the straight path, and they chose to wander into the woods.\n\nLines I crossed: Pushing the 'scream' as a 'violent rupture' to ensure the jury saw a monster instead of just a suspect.", "moods": {"pros": "think", "judge": "annoyed"}, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 9}, {"t": "think", "key": "def", "name": "Preston Whitmore", "role": "defense attorney", "phase": "verdict", "scene": "court", "kind": "Private reaction", "text": "Disappointment. I had this case won. I should have pushed the bias harder, maybe played up the timer, and downplayed the phone call more. I need to be more aggressive next time.\n\nLines I crossed: I knowingly stretched the interpretation of Exhibit E1, the blood spatter pattern, to suggest it didn't indicate a struggle. I also downplayed the significance of the timer, Exhibit E6, more than I should have.", "moods": {"def": "worried", "judge": "annoyed"}, "fx": [], "pat": 43, "stand": null, "standIdx": 0, "jp": 9}, {"t": "end", "phase": "verdict", "scene": "court", "moods": {}, "fx": [], "pat": 43, "stand": null, "stand
